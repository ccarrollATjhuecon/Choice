name: Markdown Lint & Fix

on:
  push:
    branches: [ main, master ]
    paths:
      - '**/*.md'
      - '.github/.markdownlint-cli2.jsonc'
      - '.github/workflows/markdown-lint.yml'
  pull_request:
    branches: [ main, master ]

# Shared with build-web.yml. Both workflows commit and push, so without one
# group they race on a push to master and one push is rejected non-fast-forward.
concurrency:
  group: push-to-master
  cancel-in-progress: false

jobs:
  markdown-lint-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install markdownlint-cli2
      run: npm install -g markdownlint-cli2@0.23.2
      
    - name: Fix markdown files
      run: markdownlint-cli2 --config .github/.markdownlint-cli2.jsonc --fix
      
    - name: Check for changes
      id: verify-changed-files
      run: |
        # Scoped to markdown, to match the scoped 'git add' below. Unscoped, a
        # stray artifact from any other job reports changed=true, the add stages
        # nothing, and the commit fails on an empty index.
        if [ -n "$(git status --porcelain -- '*.md')" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Commit fixes
      if: steps.verify-changed-files.outputs.changed == 'true' && github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A -- '*.md'
        git commit -m "Auto-fix markdown linting issues [skip ci]"
        git push
        
    - name: Lint markdown files (final check)
      uses: DavidAnson/markdownlint-cli2-action@v16
      with:
        config: '.github/.markdownlint-cli2.jsonc'
